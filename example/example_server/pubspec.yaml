name: example_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  crdt: ^5.1.3
  crdt_sync:
    path: ../../
  http: ^1.2.2
  serverpod: 2.9.1
  sqlite_crdt:
    path: ../../../../opensource/sqlite_crdt
  synchronized: ^3.4.0

dependency_overrides:
  sql_crdt:
    path: ../../../../opensource/sql_crdt

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 2.9.1
  test: '^1.24.2'
